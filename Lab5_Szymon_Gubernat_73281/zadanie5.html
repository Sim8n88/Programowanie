<body>
    <script>
  function oblicz(n) {
    let suma = 0;
    let znak = 1;

    for (let i = 0; i < n; i++) {
        let mianownik = 2 * i + 1; 
        suma += znak * (1 / mianownik);
        znak *= -1; 
    }
    let y = 4 * suma;
    console.log(y);
    return y;
}
oblicz(10);
    </script>
</body>
