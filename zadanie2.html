<html>

<head>
    <meta charset="utf-8">
    <style>
        #reset {
            display: inline-block;
        }

        #stop {
            display: none;
        }
    </style>
</head>

<body>
    <h1 id="czas">
        <span id="godziny">00</span>:<span id="minuty">00</span>:<span id="sekundy">00</span>
    </h1>
    <button id="start">START</button>
    <button id="zapisz">ZAPISZ</button>
    <button id="stop">STOP</button>
    <button id="reset">RESET</button>
    <p id="stan_stopera"></p>
    <ul id="zapisane_czasy">
    </ul>
    <script>
        let sekundy = 0;
        let minuty = 0;
        let godziny = 0;
        let interval = null;

        const elSekundy = document.getElementById("sekundy");
        const elMinuty = document.getElementById("minuty");
        const elGodziny = document.getElementById("godziny");
        const stan = document.getElementById("stan_stopera");
        const lista = document.getElementById("zapisane_czasy");

        const btnStart = document.getElementById("start");
        const btnStop = document.getElementById("stop");
        const btnReset = document.getElementById("reset");
        const btnZapisz = document.getElementById("zapisz");

        function formatuj(czas) {
            return czas < 10 ? "0" + czas : czas;
        }

        function aktualizuj() {
            sekundy++;
            if (sekundy === 60) {
                sekundy = 0;
                minuty++;
            }
            if (minuty === 60) {
                minuty = 0;
                godziny++;
            }

            elSekundy.textContent = formatuj(sekundy);
            elMinuty.textContent = formatuj(minuty);
            elGodziny.textContent = formatuj(godziny);
        }

        btnStart.onclick = function () {
            if (!interval) {
                interval = setInterval(aktualizuj, 1000);
            }
            stan.textContent = "Trwa odliczanie...";

            btnStart.style.display = "none";
            btnStop.style.display = "inline-block";
            btnReset.style.display = "none";
        };

        btnStop.onclick = function () {
            clearInterval(interval);
            interval = null;

            stan.textContent = "Wstrzymano odliczanie.";

            btnStart.style.display = "inline-block";
            btnStop.style.display = "none";
            btnReset.style.display = "inline-block";
        };

        btnZapisz.onclick = function () {
            const li = document.createElement("li");
            li.textContent =
                formatuj(godziny) + ":" +
                formatuj(minuty) + ":" +
                formatuj(sekundy);
            lista.appendChild(li);
        };

        btnReset.onclick = function () {
            clearInterval(interval);
            interval = null;

            sekundy = 0;
            minuty = 0;
            godziny = 0;

            elSekundy.textContent = "00";
            elMinuty.textContent = "00";
            elGodziny.textContent = "00";

            lista.innerHTML = "";
            stan.textContent = "";

            btnStart.style.display = "inline-block";
            btnStop.style.display = "none";
            btnReset.style.display = "none";
        };
    </script>
</body>

</html>
