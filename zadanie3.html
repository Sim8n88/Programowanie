<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <title>Zadanie 3</title>
</head>
<body>

<h1>Aktualny czas w Polsce:</h1>
<p id="czas">Ładowanie...</p>

<script>
function time(){
fetch("https://timeapi.io/api/Time/current/zone?timeZone=Europe/Warsaw")
    .then(response => response.json())
    .then(data => {
        const godzina = data.hour < 10 ? "0" + data.hour : data.hour;
        const minuta = data.minute < 10 ? "0" + data.minute : data.minute;
        const sekunda = data.seconds < 10 ? "0" + data.seconds : data.seconds;

        document.getElementById("czas").textContent =
            godzina + ":" + minuta + ":" + sekunda;
    })
    .catch(error => {
        document.getElementById("czas").textContent = "Błąd pobierania czasu.";
    });
}
setInterval(time,1000)
</script>

</body>
</html>
