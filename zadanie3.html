<!DOCTYPE html>

</head>
<body>
    <script>
        function Fib(n){
            if (n<0){
                return undefined
            }
            if (n<=1){
                return n
            }
            return Fib(n-1)+Fib(n-2)
        }
        console.log(Fib(2))
    </script>
</body>
</html>
